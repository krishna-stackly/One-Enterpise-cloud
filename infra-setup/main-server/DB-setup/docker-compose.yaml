services:
  postgres:
    image: postgres:17
    container_name: oec-postgres
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - /srv/postgres-data:/var/lib/postgresql/data:Z
      - "./cloud_platform 2.sql:/restore/cloud_platform.dump:ro,Z"

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 10s
      timeout: 5s
      retries: 10