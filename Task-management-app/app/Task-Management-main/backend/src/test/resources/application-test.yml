spring:
  datasource:
    url: jdbc:h2:mem:stackly;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
stackly:
  jwt:
    secret: test-secret-must-be-at-least-thirty-two-characters-long
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000
  storage:
    local-path: ./uploads-test
